name: Monitor missing XAverius CI runs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - docs/restructure-2026-10-21

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: xav-ci-run-monitor
  cancel-in-progress: false

jobs:
  check-branch-tip:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect missing wire-layout run for working-branch tip
        id: monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI_MONITOR_BRANCH: docs/restructure-2026-10-21
          CI_MONITOR_WORKFLOW: wire-layout.yml
          CI_MONITOR_GRACE_MINUTES: "20"
        run: python tools/check-ci-run-presence.py
      - name: Force the alert path for an explicit end-to-end test commit
        id: force_test_alert
        if: contains(github.event.head_commit.message || '', '[test-ci-alert]')
        run: echo "result=missing" >> "$GITHUB_OUTPUT"
      - name: Create a visible GitHub issue for a missing CI run
        if: steps.monitor.outputs.result == 'missing' || steps.force_test_alert.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test_alert="false"
          if [[ "${{ github.event.head_commit.message || '' }}" == *"[test-ci-alert]"* ]]; then
            test_alert="true"
            title="[CI monitor TEST] End-to-end issue creation verification"
          else
            title="[CI monitor] Missing wire-layout run on docs/restructure-2026-10-21"
          fi
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Existing alert issue #$existing remains open: $GH_REPO/issues/$existing"
          else
            body="$(printf 'The CI monitor found that branch tip docs/restructure-2026-10-21 has no matching push-triggered run of wire-layout.yml after the 20-minute grace period.\n\nMonitor run: %s\n\nCheck workflow triggers, branch filters, and GitHub Actions availability.' "$RUN_URL")"
            created="$(gh issue create --title "$title" --body "$body" --json number,url)"
            echo "$created"
            if [[ "$test_alert" == "true" ]]; then
              number="$(printf '%s' "$created" | jq -r .number)"
              gh issue close "$number" --comment "Automatically closed after end-to-end CI alert test."
            fi
          fi
      - name: Fail visibly if the monitor itself could not complete
        if: steps.monitor.outputs.result == 'error'
        run: |
          echo "::error title=CI monitor unavailable::The monitor could not query GitHub Actions. See the detection step logs."
          exit 1
