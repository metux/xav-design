name: Monitor missing XAverius CI runs

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches:
      - docs/restructure-2026-10-21

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: xav-ci-run-monitor
  cancel-in-progress: false

jobs:
  check-branch-tip:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect missing wire-layout run for working-branch tip
        id: monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI_MONITOR_BRANCH: docs/restructure-2026-10-21
          CI_MONITOR_WORKFLOW: wire-layout.yml
          CI_MONITOR_GRACE_MINUTES: "20"
        run: python tools/check-ci-run-presence.py
      - name: Create a visible GitHub issue for a missing CI run
        if: steps.monitor.outputs.result == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: bash tools/ensure-ci-alert-issue.sh
      - name: Fail visibly if the monitor itself could not complete
        if: steps.monitor.outputs.result == 'error'
        run: |
          echo "::error title=CI monitor unavailable::The monitor could not query GitHub Actions. See the detection step logs."
          exit 1
