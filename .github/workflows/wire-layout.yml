name: XAverius wire-layout checks

on:
  push:
    branches:
      - docs/restructure-2026-10-21
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check shell discovery tool
        run: sh -n tools/find-xav-backend.sh tests/test_find_xav_backend.sh
      - name: Test backend discovery and exclusions
        run: sh tests/test_find_xav_backend.sh
      - name: Test cross-translation-unit handler types and compiler flags
        run: python tests/test_handler_signatures.py
      - name: Audit handlers with repository compile databases when available
        shell: bash
        run: |
          mapfile -t compile_databases < <(find . -type d \( -name .git -o -name node_modules -o -name vendor -o -name third_party -o -name generated -o -name target -o -name .cache -o -name .venv -o -name venv -o -name 'build-*' \) -prune -o -name compile_commands.json -type f -print)
          mapfile -t c_sources < <(find . -type d \( -name .git -o -name node_modules -o -name vendor -o -name third_party -o -name generated -o -name target -o -name .cache -o -name .venv -o -name venv -o -name 'build-*' \) -prune -o -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) -print)
          if ((${#compile_databases[@]} > 0 && ${#c_sources[@]} > 0)); then
            python tools/check-handler-signatures.py --compile-db-root . "${c_sources[@]}"
          else
            echo "No repository compile database/native C translation units found; synthetic compiler-flag regression tests remain authoritative for this checkout."
          fi
      - name: Syntax-check checker and wire tests
        run: python -m py_compile tools/check-wire-layout.py tools/check-handler-signatures.py tests/test_handler_signatures.py tests/test_wire_vectors.py tests/test_negative_contracts.py tests/xa_state_model.py tests/test_state_model.py tests/run_timeline_regressions.py tests/test_event_vectors.py tests/test_select_events_vectors.py tests/test_reply_vectors.py tests/test_reply_spec_coverage.py tests/test_presentation_event_vectors.py tests/test_presentation_reply_vectors.py
      - name: Validate request/reply matrix and XGE event layouts
        run: python tools/check-wire-layout.py
      - name: Run Timeline semaphore regressions
        run: python tests/run_timeline_regressions.py
      - name: Run complete Python test suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
