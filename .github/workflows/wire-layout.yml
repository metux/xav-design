name: XAverius wire-layout checks

on:
  push:
    branches:
      - docs/restructure-2026-10-21
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax-check checker and wire tests
        run: python -m py_compile tools/check-wire-layout.py tests/test_wire_vectors.py tests/test_negative_contracts.py tests/test_event_vectors.py tests/test_select_events_vectors.py tests/test_reply_vectors.py tests/test_reply_spec_coverage.py tests/test_presentation_event_vectors.py tests/test_presentation_reply_vectors.py
      - name: Validate request/reply matrix and XGE event layouts
        run: python tools/check-wire-layout.py
      - name: Run golden wire-vector tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
